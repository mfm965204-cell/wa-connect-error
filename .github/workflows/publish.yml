name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        required: false
        default: latest
        type: choice
        options: [latest, next, beta]
      dry-run:
        description: Build and test only, do not publish
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION}. Bump the version and re-release."
            exit 1
          fi

      - name: Verify npm credentials
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::No npm credentials. Add an npm Automation token as the repository secret NPM_TOKEN (Settings -> Secrets and variables -> Actions), or configure a Trusted Publisher for this repository on npmjs.com and set the repository variable NPM_TRUSTED_PUBLISHER=true."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check whether this version is already on npm
        id: existing
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already published, skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.existing.outputs.published == 'false' && inputs.dry-run != true
        run: |
          set -euo pipefail
          TAG="${{ inputs.dist-tag || 'latest' }}"
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            npm publish --provenance --access public --tag "$TAG"
          else
            # Trusted publishing: npm exchanges the GitHub OIDC token for a
            # short-lived publish credential. No long-lived secret needed.
            npm publish --provenance --access public --tag "$TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "### ${NAME}@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- registry: https://registry.npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          echo "- already published: ${{ steps.existing.outputs.published }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry run: ${{ inputs.dry-run }}" >> "$GITHUB_STEP_SUMMARY"
